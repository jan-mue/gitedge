apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: gitedge-agents
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runtime
          image: gitedge-agent-runtime:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: gitedge-agents
spec:
  replicas: 0
  sandboxTemplateRef:
    name: gitedge-agents
