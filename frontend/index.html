<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitEdge - Git on the edge</title>
    <meta name="description" content="GitEdge - Self-hosted Git service with issues, pull requests, and more." />
    <meta name="author" content="GitEdge" />
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.png" />
    <!-- Critical loading styles paint before the application bundle arrives. -->
    <style>
      body { margin: 0; }
      .app-opening {
        min-height: 100vh; display: grid; place-items: center;
        background: #141a24; color: #d6dbe3; text-align: center;
        font-family: system-ui, sans-serif;
      }
      .app-opening-mark {
        margin: auto; display: grid; place-items: center;
        width: 48px; height: 48px; border-radius: 12px;
        background: #3489d8; color: white; font-size: 24px; font-weight: 700;
        box-shadow: 0 0 0 8px #3489d810;
      }
      .app-opening-title { margin: 18px 0; font-weight: 600; font-size: 18px; }
      .app-opening-dots { display: flex; justify-content: center; gap: 6px; }
      .app-opening-dots span {
        width: 5px; height: 5px; border-radius: 50%; background: #3489d8;
        animation: opening-pulse 1.4s ease-in-out infinite;
      }
      .app-opening-dots span:nth-child(2) { animation-delay: 160ms; }
      .app-opening-dots span:nth-child(3) { animation-delay: 320ms; }
      .app-opening-caption { margin-top: 16px; font-size: 12px; color: #8896a8; }
      .light .app-opening, .app-opening[data-theme="light"] { background: #fff; color: #253040; }
      @keyframes opening-pulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @media (prefers-reduced-motion: reduce) { .app-opening-dots span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot" class="app-opening" role="status" aria-label="Opening GitEdge">
        <div>
          <div class="app-opening-mark" aria-hidden="true">G</div>
          <p class="app-opening-title">GitEdge</p>
          <div class="app-opening-dots" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="app-opening-caption">Opening your workspace…</p>
        </div>
      </div>
    </div>
    <script>
      try {
        const theme = localStorage.getItem("vite-ui-theme") || "dark"
        document.getElementById("app-boot").dataset.theme = theme === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme
      } catch {}
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
