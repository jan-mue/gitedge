name: GitEdge Actions CI
on: [pull_request, workflow_dispatch]
defaults:
  run:
    shell: bun {0}
jobs:
  runner:
    name: Bun runner (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [alpha, beta]
    outputs:
      message: ${{ steps.verify.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify checkout and isolation
        id: verify
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          import assert from "node:assert/strict"
          import { appendFileSync, existsSync, writeFileSync } from "node:fs"
          assert.ok(existsSync("packages/actions-runner/package.json"))
          assert.ok(!existsSync("/gitedge/isolation-marker"))
          writeFileSync("/gitedge/isolation-marker", process.env.VARIANT)
          appendFileSync(process.env.GITHUB_OUTPUT, "message=hello\n")
          console.log(`Checked out source and verified fresh ${process.env.VARIANT} sandbox`)
  dependent:
    name: Dependency outputs
    needs: runner
    runs-on: ubuntu-latest
    steps:
      - name: Verify outputs without a source transfer
        env:
          MESSAGE: ${{ needs.runner.outputs.message }}
        run: |
          import assert from "node:assert/strict"
          import { existsSync } from "node:fs"
          assert.equal(process.env.MESSAGE, "hello")
          assert.ok(!existsSync("package.json"))
          assert.ok(!existsSync("/gitedge/isolation-marker"))
          console.log("Dependency outputs verified; source is transferred only by checkout")
