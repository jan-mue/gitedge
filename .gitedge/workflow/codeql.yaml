name: Prepared CodeQL
on: [pull_request, workflow_dispatch]
defaults:
  run:
    shell: bun {0}
jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      CODEQL_ACTION_TEST_MODE: 'true'
      CODEQL_ACTION_ANALYSIS_KEY: gitedge-preview
      CODEQL_ACTION_SKIP_WORKFLOW_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use offline feature defaults
        run: await Bun.write(`${process.env.RUNNER_TEMP}/cached-feature-flags.json`, '{}')
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: python
          tools: toolcache
          build-mode: none
          ram: 1024
          threads: 1
          config: |
            paths:
              - .gitedge/fixtures
            query-filters:
              - include:
                  id: py/sql-injection
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          upload: never
          upload-database: false
          output: .gitedge-results
      - name: Verify analysis results
        run: |
          import assert from "node:assert/strict"
          assert.ok(await Bun.file('.gitedge-results/python.sarif').exists())
          console.log('Prepared CodeQL analysis completed')
