[tool.uv]
exclude-newer = "7 days"
exclude-newer-package.certifi = false
exclude-newer-package.genai-prices = false
exclude-newer-package.pydantic-ai-harness = false
exclude-newer-package.pydantic-ai-slim = false
exclude-newer-package.pydantic-graph = false
exclude-newer-package.restate-sdk = false
workspace.members = [ "backend" ]

[tool.codespell]
skip = "uv.lock,bun.lock"

[tool.ty]
rules.missing-override-decorator = "error"
