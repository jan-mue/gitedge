repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              frontend/src/client/.*|
              backend/resources/email-templates/build/.*
          )$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^frontend/src/client/.*
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19 # frozen: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 413d39a1ae22e511c7d094682a0caf1486a49a36 # frozen: v0.0.90
    hooks:
      - id: ty
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        args: [--write-changes, --ignore-words-list=fallow]
        exclude: frontend/|^backend/resources/linguist/
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-renovate
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 50e0f3aee9dc5747a5f173f79a7417403c18dda6 # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: CHANGELOG\.md
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: eeca16c54e09b4d9a848259e46bae14737944348 # frozen: 0.13.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/fpgmaas/deptry.git
    rev: 0c39226d761685125c5ff71ca81282d6751c9540 # frozen: 0.25.1
    hooks:
      - id: deptry
        entry: bash -c 'cd backend && uv run --locked deptry app'
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb # frozen: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/jendrikseipp/vulture
    rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # frozen: v2.16
    hooks:
      - id: vulture
        entry: bash -c 'cd backend && vulture'
        language_version: python3.14
  - repo: local
    hooks:
      - id: ast-grep
        name: ast-grep lint
        language: python
        entry: sg scan --color=never --update-all --report-style=short
        types: [file]
        files: '\.(py|ts|tsx)$|^\.ast-grep/|^sgconfig\.yml$'
        pass_filenames: false
        additional_dependencies:
          - ast-grep-cli==0.51.0

      - id: ast-grep-test
        name: ast-grep rule tests
        language: python
        entry: sg test --color=never --skip-snapshot-tests
        files: '^\.ast-grep/|^sgconfig\.yml$'
        pass_filenames: false
        additional_dependencies:
          - ast-grep-cli==0.51.0

      - id: pyproject-pinned-deps
        name: Check pyproject dependencies are pinned
        language: pygrep
        files: '(^|/)pyproject\.toml$'
        entry: '^\s*"[^"]+\s*(>=|<=|~=|!=|<|>|==[^"]*\*)'

      - id: forbid-ble001-ignore
        name: Forbid explicit BLE001 ignores
        language: pygrep
        types: [python]
        entry: '#\s*(?:noqa|ruff:\s*noqa):\s*[^#\n]*\bBLE001\b'

      - id: biome-check
        name: biome check
        entry: bun run lint
        language: system
        types: [text]
        files: ^frontend/
        pass_filenames: false

      - id: fallow
        name: fallow
        entry: bun run fallow
        language: system
        files: \.(ts|js|tsx|jsx|mjs|css|mdx)$|(^|/)package\.json$|^bun\.lock$|^\.fallowrc\.json$
        pass_filenames: false

      - id: generate-frontend-sdk
        name: Generate Frontend SDK
        entry: bash ./scripts/generate-client.sh
        pass_filenames: false
        language: unsupported
        files: ^backend/app/.*\.py$|^backend/pyproject\.toml$|^uv\.lock$|^frontend/openapi-ts\.config\.ts$|^scripts/generate-client\.sh$
