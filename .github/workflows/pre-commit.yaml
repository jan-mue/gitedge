name: Run pre-commit

on:
  pull_request:
  push:
    branches:
      - main

env:
  CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun's package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun ci

      - name: Install backend dependencies
        run: uv sync --locked

      - name: Run pre-commit
        id: pre-commit
        uses: tox-dev/action-pre-commit-uv@e09b8958484dfe71f4ac3bc7afb230ba506402ec # v1.0.5
        with:
          uv-install: "false"
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR Push token
        id: pr-push
        if: env.CAN_PUSH == 'true' && steps.changes.outputs.changed == 'true'
        uses: tiangolo/pr-push@f336b3817f32ea9b8273a8c15f8ecb739ac38167 # 0.0.4

      - name: Commit and push pre-commit fixes
        if: env.CAN_PUSH == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pr-push.outputs.token }}
        run: |
          git config user.name "pr-push[bot]"
          git config user.email "pr-push[bot]@users.noreply.github.com"
          gh auth setup-git
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: apply pre-commit fixes"
            git push
          fi

      - name: Fail on pre-commit errors
        if: steps.pre-commit.outcome == 'failure'
        run: exit 1
