[project]
name = "gitedge"
version = "0.1.0"
description = "Serverless Git forge"
readme = "README.md"
requires-python = ">=3.14,<3.15"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ag-ui-protocol==1.0.0",
    "aiobotocore==3.10.0",
    "alembic==1.20.1",
    "botocore==1.43.117",
    "casbin-async-sqlalchemy-adapter==1.17.0",
    "cryptography==50.0.2",
    "docker==7.2.0",
    "dulwich==1.2.21",
    "emails==1.1.3",
    "fastapi==0.162.4",
    "fastapi-redis-sdk==0.9.1",
    "jinja2==3.1.6",
    "k8s-agent-sandbox==1.0.11",
    "markdown-it-py[linkify]==4.3.0",
    "mdit-py-plugins==0.7.0",
    "merge3==1.0.0",
    "psycopg[binary]==3.3.8",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pycasbin==2.8.0",
    "pydantic[email]==2.14.3",
    "pydantic-ai-harness[coder]==0.68.0",
    "pydantic-ai-slim[ag-ui,anthropic,mcp,openai]==2.68.0",
    "pydantic-settings==2.16.2",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.33",
    "redis[hiredis]==8.1.0",
    "restate-sdk[client,pydantic-ai,serde]==1.5.2",
    "sentry-sdk==2.74.0",
    "sqlalchemy[asyncio]==2.1.8",
    "tenacity==9.2.1",
    "upstash-redis==1.9.0",
    "uvicorn==0.54.0",
    "vercel==0.11.6",
]

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "deptry==0.25.1",
    "httpx2==2.16.0",
    "inline-snapshot[black]==0.36.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-mock==3.17.0",
    "pytest-playwright==0.10.0",
    "pytest-socket==0.8.1",
    "pytest-xprocess==1.0.2",
    "restate-sdk[harness]==1.5.2",
    "testcontainers[k3s,mailpit,minio,ollama,postgres,redis]==4.15.0",
    "types-pygments==2.21.0.20260819",
]

[tool.ruff]
target-version = "py314"
line-length = 120
lint.select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "DOC",   # pydoclint
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "ERA",   # no commented-out code
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FAST",  # FastAPI
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging)
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
lint.ignore = [
    "E501",    # Line too long, handled by formatter
    "PLR0913", # Too many arguments in function definition"
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PT013",   # Incorrect import of `pytest`
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "TC006",   # Add quotes to type expression in `typing.cast()`
]
lint.per-file-ignores."__init__.py" = [ "D104", "F401" ]
lint.per-file-ignores."migrations/**" = [ "D", "S", "TC003" ]
lint.per-file-ignores."tests/**" = [ "D", "PLR2004", "S" ]
lint.unfixable = []
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.flake8-tidy-imports.banned-api."unittest.mock".msg = "Use `pytest-mock` instead."
lint.flake8-type-checking.runtime-evaluated-base-classes = [
    "app.entities.base.Base",
    "app.entities.issues.Issue",
    "app.entities.principals.Principal",
    "app.schemas.base.GitEdgeBaseModel",
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
]
lint.flake8-type-checking.runtime-evaluated-decorators = [
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
]
lint.isort.known-first-party = [ "app" ]
lint.pydocstyle.convention = "google"

[tool.deptry]
per_rule_ignores.DEP002 = [
    "merge3",           # Required by dulwich for three-way merge calculations
    "python-multipart", # Required to handle form data in FastAPI
    "psycopg",          # Used by SQLAlchemy as database driver
    "alembic",          # Used to run database migrations
    "uvicorn",          # Used by run_app_locally.py, outside the scanned app/ source
]
known_first_party = [ "app" ]

[tool.vulture]
paths = [ "app" ]
exclude = [ "app/schemas/" ]
ignore_names = [
    # Group: used dynamically by dulwich
    "add_thin_pack",
    "bare",
    "commit_timezone",
    # Group: serialized to JSON payloads
    "conflicting_files",
    "diff_line_count",
    "last_used_at",
    "mergeable",
    "no_newline",
    "reason",
    "revoked_reason",
    "secret_last4",
    "series",
    # Group: LogLevel enum values
    "CRITICAL",
    "DEBUG",
    "ERROR",
    "NOTSET",
    # Group: reserved Pydantic/SQLAlchemy members
    "metadata",
    "model_config",
    # Group: Agent Trace and workspace serialized fields
    "content_hash",
    "contributor_type",
    "conversation_url",
    "end_line",
    "model_id",
    "pinned",
    "start_line",
    "tool_name",
    "tool_version",
    "trace_id",
    "vcs_type",
    "version",
    # Group: optional sandbox implementations and protocol methods
    "DockerSandboxClient",
    "working_dir",
    # Group: RepositoryChanges TypedDict keys
    "pack_deletes",
    "pack_uploads",
    "ref_deletes",
    "ref_puts",
]
ignore_decorators = [
    "@app.*",
    "@comment_router.*",
    "@computed_field",
    "@field_validator",
    "@model_validator",
    "@override",
    "@router.*",
    "@user_router.*",
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true

[tool.ty]
analysis.allowed-unresolved-imports = [
    "emails.**",
    "testcontainers.**",
    "xprocess.**",
]

[tool.pytest]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = [ "app" ]
run.dynamic_context = "test_function"
report.exclude_also = [
    "@(abc\\.)?abstractmethod",
    "@(typing(_extensions)?\\.)?overload",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
report.show_missing = true
report.sort = "-Cover"

[tool.vercel]
scripts.build = "uv run --no-sync bash scripts/prestart.sh"
