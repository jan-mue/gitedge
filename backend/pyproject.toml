[project]
name = "forgeless"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "alembic==1.18.5",
    "emails==0.6",
    "fastapi[standard]==0.140.13",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "psycopg[binary]==3.3.4",
    "pwdlib[argon2,bcrypt]==0.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt==2.13.0",
    "sentry-sdk==2.66.1",
    "sqlalchemy==2.0.51",
    "tenacity==9.1.4",
    "typing-extensions==4.16.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "coverage==7.15.2",
    "deptry==0.25.1",
    "mypy==1.20.2",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.16.0",
    "testcontainers[postgres]==4.15.0",
    "types-passlib==1.7.7.20260211",
]

[tool.ruff]
target-version = "py310"
exclude = [ "alembic" ]
lint.select = [
    "ARG001", # unused arguments in functions
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "T201",   # print statements are not allowed
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
lint.ignore = [
    "B008", # do not perform function calls in argument defaults
    "B904", # Allow raising exceptions without from e, for HTTPException
    "E501", # line too long, handled by black
    "W191", # indentation contains tabs
]
# Preserve types, even if a file imports `from __future__ import annotations`.
lint.pyupgrade.keep-runtime-typing = true

[tool.codespell]
skip = "uv.lock"

[tool.deptry]
per_rule_ignores.DEP002 = [
    "psycopg", # used by SQLAlchemy
]

[tool.pyproject-fmt]
indent = 4
column_width = 120
keep_full_version = true

[tool.mypy]
strict = true
exclude = [ "venv", ".venv", "alembic" ]
overrides = [ { module = [
    "emails",
    "testcontainers.*",
], ignore_missing_imports = true } ]

[tool.coverage]
run.dynamic_context = "test_function"
run.source = [ "app" ]
report.show_missing = true
report.sort = "-Cover"
html.show_contexts = true

[tool.vercel]
scripts.build = "uv run bash scripts/prestart.sh"
