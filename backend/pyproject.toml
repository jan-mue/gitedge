[project]
name = "gitedge"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "alembic==1.20.0",
    "emails==1.1.2",
    "fastapi[standard]==0.141.1",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "psycopg[binary]==3.3.5",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.14.0",
    "sentry-sdk==2.69.1",
    "sqlalchemy==2.0.52",
    "tenacity==9.1.4",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "deptry==0.25.1",
    "mypy==1.20.2",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "testcontainers[postgres]==4.15.0",
    "types-passlib==1.7.7.20260211",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [ "alembic" ]
lint.select = [
    "ARG001", # unused arguments in functions
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "T201",   # print statements are not allowed
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
lint.ignore = [
    "B008", # do not perform function calls in argument defaults
    "B904", # Allow raising exceptions without from e, for HTTPException
    "E501", # line too long, handled by black
    "W191", # indentation contains tabs
]
# Preserve types, even if a file imports `from __future__ import annotations`.
lint.pyupgrade.keep-runtime-typing = true

[tool.deptry]
per_rule_ignores.DEP002 = [
    "psycopg", # used by SQLAlchemy
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true

[tool.mypy]
exclude = [ ".venv", "alembic", "venv" ]
strict = true
plugins = [ "pydantic.mypy" ]
overrides = [ { module = [
        "emails",
        "testcontainers.*",
    ], ignore_missing_imports = true } ]

[tool.coverage]
run.source = [ "app" ]
run.dynamic_context = "test_function"
report.show_missing = true
report.sort = "-Cover"
html.show_contexts = true

[tool.vercel]
scripts.build = "uv run bash scripts/prestart.sh"
