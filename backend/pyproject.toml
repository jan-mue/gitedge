[project]
name = "gitedge"
version = "0.1.0"
description = "Serverless Git forge"
readme = "README.md"
requires-python = ">=3.14,<4.0"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aiobotocore==3.9.1",
    "alembic==1.20.0",
    "botocore==1.43.75",
    "dulwich==1.2.15",
    "emails==1.1.3",
    "fastapi==0.142.2",
    "jinja2==3.1.6",
    "markdown-it-py[linkify]==4.2.0",
    "mdit-py-plugins==0.6.1",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "redis[hiredis]==8.1.0",
    "sentry-sdk==2.71.0",
    "sqlalchemy[asyncio]==2.1.2",
    "tenacity==9.1.4",
    "upstash-redis==1.8.0",
    "uvicorn==0.54.0",
    "vercel==0.11.4",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "deptry==0.25.1",
    "inline-snapshot[black]==0.36.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.16.0",
    "pytest-playwright==0.9.0",
    "pytest-xprocess==1.0.2",
    "testcontainers[mailpit,minio,postgres,redis]==4.15.0",
    "types-pygments==2.21.0.20260819",
]

[tool.ruff]
target-version = "py314"
line-length = 120
lint.select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "DOC",   # pydoclint
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "ERA",   # no commented-out code
    "F",     # pyflakes
    "FA",    # flake8-future-annotations
    "FAST",  # FastAPI
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "LOG",   # flake8-logging)
    "N",     # pep8-naming
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TC",    # flake8-type-checking
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
lint.ignore = [
    "E501",    # Line too long, handled by formatter
    "PLR0913", # Too many arguments in function definition"
    "PT013",   # Incorrect import of `pytest`
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "TC006",   # Add quotes to type expression in `typing.cast()`
]
lint.per-file-ignores."__init__.py" = [ "D104", "F401" ]
lint.per-file-ignores."migrations/**" = [ "D", "S", "TC003" ]
lint.per-file-ignores."tests/**" = [ "D", "PLR2004", "S" ]
lint.unfixable = []
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.flake8-tidy-imports.banned-api."unittest.mock".msg = "Use `pytest-mock` instead."
lint.flake8-type-checking.runtime-evaluated-base-classes = [
    "app.entities.base.Base",
    "app.entities.issues.Issue",
    "app.schemas.base.GitEdgeBaseModel",
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
]
lint.flake8-type-checking.runtime-evaluated-decorators = [
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
]
lint.isort.known-first-party = [ "app" ]
lint.pydocstyle.convention = "google"

[tool.deptry]
per_rule_ignores.DEP002 = [
    "python-multipart", # Required to handle form data in FastAPI
    "psycopg",          # Used by SQLAlchemy as database driver
    "alembic",          # Used to run database migrations
    "uvicorn",          # Used by run_app_locally.py, outside the scanned app/ source
]
known_first_party = [ "app" ]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true

[tool.ty]
analysis.allowed-unresolved-imports = [
    "emails.**",
    "testcontainers.**",
    "xprocess.**",
]

[tool.pytest]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = [ "app" ]
run.dynamic_context = "test_function"
report.exclude_also = [
    "@(abc\\.)?abstractmethod",
    "@(typing(_extensions)?\\.)?overload",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
report.show_missing = true
report.sort = "-Cover"

[tool.vercel]
scripts.build = "uv run bash scripts/prestart.sh"
