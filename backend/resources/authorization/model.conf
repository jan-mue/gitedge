[request_definition]
r = sub, obj, act, kind

[policy_definition]
p = sub, act, credential

[role_definition]
g = _, _
g2 = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.act == p.act && r.sub.active && ((r.kind == "account" && ((r.sub.superuser && (g("owner", p.sub) || g("org_admin", p.sub) || g("site_admin", p.sub))) || (r.sub.name == r.obj.owner_subject && (g("owner", p.sub) || p.sub == "self")) || (r.obj.public && g("read", p.sub)) || g2(r.sub.name, p.sub, r.obj.domain))) || (r.kind == "token" && p.credential == "token" && (r.obj.id == "" || r.obj.id in r.sub.repository_ids) && (p.sub == "token" || g(r.sub.name, p.act))))
