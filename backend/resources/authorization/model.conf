[request_definition]
r = sub, act, kind

[policy_definition]
p = sub, act, credential

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.act == p.act && ((r.kind == "account" && g(r.sub, p.sub)) || (r.kind == "token" && p.credential == "token" && g(r.sub, p.act)))
