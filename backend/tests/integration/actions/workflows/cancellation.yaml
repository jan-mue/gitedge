name: Cancellation
on: workflow_dispatch
jobs:
  long:
    runs-on: ubuntu-latest
    steps:
      - shell: bun {0}
        run: |
          const child = Bun.spawn(["setsid", "sleep", "600"], {stdin: "ignore", stdout: "inherit", stderr: "inherit"})
          await Bun.write("/gitedge/escaped.pid", String(child.pid))
          console.log("Long job started")
          await Bun.sleep(600000)
  dependent:
    needs: long
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Should remain queued'
