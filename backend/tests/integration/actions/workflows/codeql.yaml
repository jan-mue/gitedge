name: Offline CodeQL analysis
on: workflow_dispatch
jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      CODEQL_ACTION_TEST_MODE: 'true'
      CODEQL_ACTION_ANALYSIS_KEY: gitedge-actions-integration
      CODEQL_ACTION_SKIP_WORKFLOW_VALIDATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use offline CodeQL feature defaults
        run: printf '{}' > "$RUNNER_TEMP/cached-feature-flags.json"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python
          tools: toolcache
          build-mode: none
          ram: 1024
          threads: 1
          config: |
            query-filters:
              - include:
                  id: py/sql-injection
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          upload: never
          upload-database: false
          output: results
      - name: Verify SARIF results
        run: test -f results/python.sarif
